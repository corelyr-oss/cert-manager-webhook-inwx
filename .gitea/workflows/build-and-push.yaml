name: build-image
run-name: ${{ gitea.actor }} is testing out Gitea Actions 🚀 🚀 🚀

on:
  push:
    branches: ["main"]
    paths:
      - .gitea/workflows/build-and-push.yaml

  workflow_dispatch:

env:
  chartVersion: 0.6.2
  containerRegistry: 'git.cluster.tf'
  HELM_EXPERIMENTAL_OCI: 1

jobs:
  build-image:
    name: build-image
    runs-on: ubuntu-latest

    container:
      # image: ghcr.io/catthehacker/ubuntu:act-latest
      image: gitea/runner-images:ubuntu-latest
      #image: gitea.example.com/xyz/ubuntu-act:22.04
      # credentials:
      #   username: ${{ gitea.actor }}
      #   password: ${{  secrets.REGISTRY_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - uses: azure/setup-helm@v4.2.0
        id: install

      #
      # https://github.com/docker/metadata-action
      #
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.containerRegistry }}/los/cert-manager-webhook-inwx
          tags: |
            type=schedule,pattern={{date 'YYYYMMDDHHMM'}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Set up Docker Context for Buildx
        id: buildx-context
        run: |
          export DOCKER_HOST=tcp://docker:2376/
          export DOCKER_TLS_CERTDIR="/certs"
          export DOCKER_TLS_VERIFY=1
          export DOCKER_CERT_PATH="/certs/client"
          docker context create builders

      # https://github.com/docker/setup-buildx-action
      # https://docs.docker.com/engine/reference/commandline/cli/#environment-variables
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          # buildkitd-flags: --debug
          endpoint: builders
        env:
          DOCKER_HOST: "tcp://docker:2376/"
          DOCKER_TLS_CERTDIR: "/certs"
          DOCKER_TLS_VERIFY: 1
          DOCKER_CERT_PATH: "/certs/client"

      #
      # Debug
      #
      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      #
      # https://github.com/docker/login-action
      #
      - name: Login to Gitea
        uses: docker/login-action@v3
        with:
          registry: git.cluster.tf
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      #
      # https://github.com/docker/build-push-action
      #
      - name: Build and push the image
        if: gitea.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          push: ${{ gitea.event_name != 'pull_request' }}
          platforms: linux/amd64
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
        env:
          DOCKER_HOST: "tcp://docker:2376/"
          DOCKER_TLS_CERTDIR: "/certs"
          DOCKER_TLS_VERIFY: 1
          DOCKER_CERT_PATH: "/certs/client"

      - name: Lint 
        run: helm lint .
        working-directory: ./deploy/cert-manager-webhook-inwx/

      - name: Helm Chart Update, Package and Push
        run: |
          git_hash=$(git rev-parse --short "$GITHUB_SHA")
          escaped_version=$(printf '%s\n' "${{ env.chartVersion }}" | sed -e 's/[\/.]/\\./g') 
          sed -i "s/version\: 0\.0\.0/version\: $escaped_version/" Chart.yaml
          helm package . --app-version sha-$git_hash 
          helm push cert-manager-webhook-inwx-${{ env.chartVersion }}.tgz oci://${{ env.containerRegistry }}/los/charts
        working-directory: ./deploy/cert-manager-webhook-inwx/