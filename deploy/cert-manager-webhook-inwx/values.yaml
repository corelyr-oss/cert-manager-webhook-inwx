## The API group this webhook serves. THE SINGLE SOURCE OF TRUTH for it, as of
## 0.8.0: the APIService name and spec, the RBAC rule, and the binary's own
## GROUP_NAME environment variable are all rendered from this one value. It was
## previously compiled into main.go as well, where it could silently disagree.
##
## The ClusterIssuers are the one copy this chart cannot reach -- they live in
## clp-talos-state-prod cert-manager/cert-manager-issuer and must repeat this
## string verbatim in their `solvers[].dns01.webhook.groupName`.
##
## ⚠️  IT IS AN IDENTIFIER, NOT AN ADDRESS. Nothing resolves it, which is why the
## old value (`cert-manager-webhook-inwx.git.cluster.tf`) kept working long after
## that host was retired and its DNS record was repointed. Renaming it was
## therefore never urgent -- it is done here because it names a registry that no
## longer exists and reads like a live dependency to anyone new.
##
## ⚠️  CHANGING IT DELETES AND RECREATES AN APIService cert-manager depends on,
## and the ClusterIssuers must move in the same sync. Between the two, a DNS-01
## challenge would resolve to a group nothing answers for.
groupName: cert-manager-webhook-inwx.corelyr.com

credentialsSecretRefs:
- inwx-credentials

deployment:
  loglevel: 2

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

## Was unset while templates/deployment.yaml read it, so `replicas:` rendered
## empty and the API server defaulted it. Stated now; the value is unchanged.
replicaCount: 1

image:
  ## ghcr.io, NOT git.cluster.tf (dead) and NOT repository.tf (a migration that
  ## never published anything). Built and pushed by .github/workflows/image.yml
  ## with the run's own GITHUB_TOKEN.
  repository: ghcr.io/corelyr-oss/cert-manager-webhook-inwx
  pullPolicy: IfNotPresent
  ## EMPTY ON PURPOSE -- falls through to .Chart.AppVersion, which the workflow
  ## sets to the image tag built from the same commit. The chart version is
  ## therefore already an exact image pin; overriding a tag here would decouple
  ## the two again, which is how sha-918d625 outlived the registry holding it.
  tag: ""

## EMPTY, and that is the point of publishing publicly: an anonymous pull works,
## so no cluster consuming this chart needs a registry credential, a pull secret,
## or a Vault role to mint one.
##
## ⚠️  IF PULLS 401, THE PACKAGE IS STILL PRIVATE. GitHub creates a package
## private on its first push and only a human can make it public, in the
## repository's package settings -- there is no workflow flag for it. The
## symptom is ImagePullBackOff on a tag that visibly exists, which reads like a
## missing pull secret. It is not; do not add one to work around it.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 443

resources: {}
#  limits:
#    cpu: 100m
#    memory: 128Mi
#  requests:
#    cpu: 10m
#    memory: 24Mi

nodeSelector: {}

tolerations: []

affinity: {}
